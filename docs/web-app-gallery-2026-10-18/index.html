, "desktop": "shop-1280-after.jpg", "mobile": "shop-390-after.jpg", "full": "shop-full-1280-after.jpg"}, {"key": "profile", "title": "我的 · 初始状态", "route": "/profile/", "note": "", "desktop": "profile-1280-after.jpg", "mobile": "profile-390-after.jpg", "full": "profile-full-1280-after.jpg"}, {"key": "profile-populated", "title": "我的 · 周报与成就", "route": "/profile/", "note": "演示存档；完整长截图包括周报、成就、家长设置与备份。", "desktop": "profile-populated-1280-after.jpg", "full": "profile-full-1280-after.jpg"}, {"key": "hearts-dialog", "title": "红心详情弹窗", "route": "/league/", "note": "点击右上方红心后的状态。", "desktop": "hearts-dialog-1280-after.jpg"}];let selected=0,mode='desktop';const $=id=>document.getElementById(id);function show(i,m=mode){selected=i;const p=pages[i];mode=p[m]?m:'desktop';$('hero').src='screenshots/'+p[mode];$('hero').alt=p.title+' · '+(mode==='mobile'?'手机':'桌面');$('stage').className='stage '+mode;$('title').textContent=String(i+1).padStart(2,'0')+' · '+p.title;$('route').textContent=p.route;$('note').textContent=p.note||'浅色模式 · 浏览器实际界面';$('original').href=$('hero').src;$('index').textContent=(i+1)+' / '+pages.length;for(const k of ['desktop','mobile','full']){$(k).setAttribute('aria-pressed',String(mode===k));$(k).disabled=!p[k]}$('prev').disabled=i===0;$('next').disabled=i===pages.length-1;document.querySelectorAll('#nav button').forEach((b,n)=>b.setAttribute('aria-current',String(n===i)));}pages.forEach((p,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' '+p.title;b.onclick=()=>{show(i);window.scrollTo({top:0,behavior:'smooth'})};$('nav').appendChild(b);const t=document.createElement('button');t.className='thumb';t.setAttribute('aria-label','查看 '+p.title);const img=document.createElement('img');img.src='screenshots/'+p.desktop;img.alt=p.title;img.loading='lazy';const s=document.createElement('span');s.textContent=String(i+1).padStart(2,'0')+' · '+p.title;t.append(img,s);t.onclick=()=>{show(i,'desktop');window.scrollTo({top:0,behavior:'smooth'})};$('grid').appendChild(t)});for(const k of ['desktop','mobile','full'])$(k).onclick=()=>show(selected,k);$('prev').onclick=()=>show(Math.max(0,selected-1));$('next').onclick=()=>show(Math.min(pages.length-1,selected+1));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&selected>0)show(selected-1);if(e.key==='ArrowRight'&&selected<pages.length-1)show(selected+1)});show(0);</script></html>
