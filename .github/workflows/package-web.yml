name: Package Web Deploy

on:
  workflow_dispatch:
    inputs:
      assets_tag:
        description: "上游资源 Release tag"
        required: true
        default: "v1.4.0-content"
      release_tag:
        description: "本仓库发布 tag"
        required: true
        default: "web-deploy"

permissions:
  contents: write

concurrency:
  group: package-web-deploy
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    # 用上游预构建产物拼装（下载 + 校验 + 打包），不做编译/转码
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and package from upstream prebuilt assets
        run: bash scripts/package-web-deploy.sh "${{ inputs.assets_tag }}"

      - name: Upload workflow artifact (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: china-study-free-web
          path: dist/china-study-free-web.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (split parts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          NOTES="$(cat <<'EOF'
          ## Web 静态部署包

          由 GitHub Actions 构建的完整静态站点（含音频 / 配图 / 课本原页）。

          ### 部署

          ```bash
          cat china-study-free-web.tar.gz.part-* > china-study-free-web.tar.gz
          mkdir -p /var/www/china-study
          tar -xzf china-study-free-web.tar.gz -C /var/www/china-study
          ```

          Nginx 根目录指向该目录：`try_files $uri $uri/ $uri/index.html =404;`
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新资源..."
            gh release upload "$TAG" dist/china-study-free-web.tar.gz.part-* --clobber
          else
            gh release create "$TAG" \
              --title "Web 静态部署包 (${TAG})" \
              --notes "$NOTES" \
              dist/china-study-free-web.tar.gz.part-*
          fi

          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          ls -lh dist/
